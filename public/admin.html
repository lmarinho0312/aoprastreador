<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Cozinha - Monitoramento de Entregas</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
    }

    /* DASHBOARD LAYOUT */
    .app-sidebar {
      width: 440px;
      height: 100vh;
      background: var(--panel-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .app-main {
      flex: 1;
      height: 100vh;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #191a1a;
    }

    /* SIDEBAR HEADER */
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* STATS BADGES */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    /* TABS NAV */
    .tab-nav-admin {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 16px;
      border-bottom: 1px solid var(--card-border);
      gap: 8px;
    }

    .tab-btn-admin {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn-admin.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* SEARCH BAR */
    .search-box {
      padding: 12px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    /* MOTOBOY & HISTÓRICO LIST */
    .content-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .card-item:hover {
      border-color: rgba(59, 130, 246, 0.4);
      background: rgba(30, 41, 59, 0.9);
    }

    .card-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.idle { background: var(--warning); }
    .status-dot.done { background: var(--primary); }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .pedidos-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pedido {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-rota {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-rota:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-rota:active {
      transform: scale(0.98);
    }

    /* FOOTER STATUS BAR */
    .sidebar-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--card-border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.9);
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* FLOATING NOTIFICATION TOAST */
    #mapToast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 10px;
    }

    /* CUSTOM LEAFLET MARKERS & POPUPS */
    .custom-marker {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .route-marker-start {
      background: #10b981;
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }

    .route-marker-end {
      background: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }

    .leaflet-popup-content-wrapper {
      background: var(--panel-bg) !important;
      color: #ffffff !important;
      border: 1px solid var(--card-border);
      border-radius: 14px !important;
      padding: 4px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
    }

    .leaflet-popup-tip { background: var(--panel-bg) !important; }

    .popup-box { padding: 12px; min-width: 200px; }
    .popup-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: #ffffff; }
    .popup-phone { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

    /* MOBILE FLEXIBILITY */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        overflow-y: auto;
      }
      .app-sidebar {
        width: 100%;
        height: 60vh;
      }
      .app-main {
        width: 100%;
        height: 70vh;
      }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- TOAST FLUTUANTE PARA MOBILE E DESKTOP -->
  <div id="mapToast">
    <span>📍</span>
    <span id="mapToastMsg">Rota desenhada no mapa!</span>
  </div>

  <!-- PAINEL LATERAL DA COZINHA -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-logo">🍽️</div>
        <div>
          <h1 class="brand-title">Painel da Cozinha</h1>
          <p class="brand-subtitle">Monitoramento e Histórico de Entregas</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="statMotoboys">0</div>
          <div class="stat-lbl">Entregadores</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statPedidos" style="color: var(--accent);">0</div>
          <div class="stat-lbl">Em Rota</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statGps">OFF</div>
          <div class="stat-lbl">Sinal GPS</div>
        </div>
      </div>
    </div>

    <!-- TABS NAVEGAÇÃO -->
    <div class="tab-nav-admin">
      <button class="tab-btn-admin active" id="tabAoVivoBtn" onclick="trocarAbaAdmin('aovivo')">📡 Ao Vivo</button>
      <button class="tab-btn-admin" id="tabHistoricoBtn" onclick="trocarAbaAdmin('historico')">📜 Histórico</button>
    </div>

    <!-- BUSCA DE PEDIDOS OU MOTOBOYS -->
    <div class="search-box">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por pedido ou motoboy..." oninput="filtrarConteudo()">
      </div>
    </div>

    <!-- VIEW 1: LISTA MOTOBOYS AO VIVO -->
    <div class="content-list" id="motoboyList">
      <!-- Renderizado via JS -->
    </div>

    <!-- VIEW 2: HISTÓRICO DE ENTREGAS -->
    <div class="content-list hidden" id="historicoList">
      <!-- Renderizado via JS -->
    </div>

    <!-- FOOTER DA BARRA LATERAL -->
    <div class="sidebar-footer">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="live-pulse"></span>
        <span id="footerStatusText">ATUALIZANDO A CADA 5s</span>
      </div>
      <span id="lastUpdateText">--:--:--</span>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL DO MAPA INTERATIVO -->
  <main class="app-main">
    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    let map;
    let markers = {};
    let activeRoutePolylineBg = null;
    let activeRoutePolylineFg = null;
    let routeMarkers = [];
    let motoboysData = [];
    let historicoData = [];
    let abaAtual = 'aovivo';
    let pollingInterval = null;

    // HELPER: HORÁRIO DE BRASÍLIA (UTC-3)
    function formatarHoraBrasilia(dateStr) {
      if (!dateStr) return '--:--';
      // Se a string contiver a data completa (ex: "2026-08-11 17:52:51" ou ISO)
      if (typeof dateStr === 'string' && dateStr.includes(' ')) {
        const parts = dateStr.split(' ');
        if (parts.length === 2) {
          const timeParts = parts[1].split(':');
          return `${timeParts[0]}:${timeParts[1]}`;
        }
      }
      try {
        const d = new Date(dateStr);
        return d.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return dateStr;
      }
    }

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      carregarDadosAoVivo();
      pollingInterval = setInterval(() => {
        if (abaAtual === 'aovivo') carregarDadosAoVivo();
      }, 5000);
    });

    // INICIALIZAR LEAFLET MAP
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([-23.5615, -46.6560], 13);
      L.control.zoom({ position: 'topright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    // ALTERNAR ABAS (AO VIVO / HISTÓRICO)
    function trocarAbaAdmin(aba) {
      abaAtual = aba;
      const tabAoVivoBtn = document.getElementById('tabAoVivoBtn');
      const tabHistoricoBtn = document.getElementById('tabHistoricoBtn');
      const motoboyList = document.getElementById('motoboyList');
      const historicoList = document.getElementById('historicoList');

      limparRotaNoMapa();

      if (aba === 'aovivo') {
        tabAoVivoBtn.classList.add('active');
        tabHistoricoBtn.classList.remove('active');
        motoboyList.classList.remove('hidden');
        historicoList.classList.add('hidden');
        document.getElementById('footerStatusText').textContent = 'ATUALIZANDO A CADA 5s';
        carregarDadosAoVivo();
      } else {
        tabHistoricoBtn.classList.add('active');
        tabAoVivoBtn.classList.remove('active');
        historicoList.classList.remove('hidden');
        motoboyList.classList.add('hidden');
        document.getElementById('footerStatusText').textContent = 'HISTÓRICO DE ENTREGAS';
        carregarHistorico();
      }
    }

    // BUSCAR DADOS DA API AO VIVO /api/admin/posicoes-mapa
    async function carregarDadosAoVivo() {
      try {
        const response = await fetch('/api/admin/posicoes-mapa');
        const result = await response.json();

        if (response.ok && result.success) {
          motoboysData = result.data || [];
          
          document.getElementById('statMotoboys').textContent = result.total_motoboys || 0;
          document.getElementById('statPedidos').textContent = result.total_pedidos_em_rota || 0;
          
          const gpsElement = document.getElementById('statGps');
          if (result.traccar_online) {
            gpsElement.textContent = 'ONLINE';
            gpsElement.style.color = 'var(--accent)';
          } else {
            gpsElement.textContent = 'DEV MOCK';
            gpsElement.style.color = 'var(--warning)';
          }

          document.getElementById('lastUpdateText').textContent = formatarHoraBrasilia(new Date().toISOString());

          if (abaAtual === 'aovivo') {
            renderizarListaMotoboys();
            atualizarMarcadoresAoVivo();
          }
        }
      } catch (err) {
        console.error('❌ Erro ao consultar posições do mapa:', err);
      }
    }

    // RENDERIZAR LISTA LATERAL DE MOTOBOYS (AO VIVO)
    function renderizarListaMotoboys() {
      const container = document.getElementById('motoboyList');
      const termoBusca = document.getElementById('searchInput').value.toLowerCase().trim();

      const motoboysFiltrados = motoboysData.filter(m => {
        if (!termoBusca) return true;
        return m.nome.toLowerCase().includes(termoBusca) ||
               m.telefone.toLowerCase().includes(termoBusca) ||
               m.pedidos_numeros.some(p => p.toLowerCase().includes(termoBusca));
      });

      if (motoboysFiltrados.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 40px 10px;">
            <div style="font-size: 32px; margin-bottom: 8px;">🔍</div>
            <p>Nenhum entregador encontrado.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = motoboysFiltrados.map(m => {
        const temPedidos = m.pedidos_numeros.length > 0;
        return `
          <div class="card-item" onclick="focarMotoboyNoMapa(${m.motoboy_id})" style="cursor: pointer;">
            <div class="card-item-header">
              <div class="card-title">
                <span class="status-dot ${temPedidos ? 'active' : 'idle'}"></span>
                ${m.nome}
              </div>
              <span style="font-size: 11px; font-weight: 700; color: ${temPedidos ? '#93c5fd' : 'var(--text-muted)'}">
                ${temPedidos ? m.pedidos_numeros.length + ' pedido(s)' : 'Disponível'}
              </span>
            </div>

            <div class="card-meta">
              <span>📞 ${m.telefone}</span>
              <span>⚡ ${Math.round(m.speed || 0)} km/h</span>
              <span style="color: ${m.origem_gps === 'gps_real' ? 'var(--accent)' : 'var(--text-muted)'}; font-weight: 700;">
                ${m.origem_gps === 'gps_real' ? '📡 GPS Real' : '⚙️ Simulado'}
              </span>
            </div>

            ${temPedidos ? `
              <div class="pedidos-tags">
                ${m.pedidos_detalhes.map(p => `
                  <span class="tag-pedido">#${p.numero_pedido} (${p.minutos_em_rota}m)</span>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // ATUALIZAR MARCADORES DA VISTA AO VIVO
    function atualizarMarcadoresAoVivo() {
      const bounds = [];

      motoboysData.forEach(m => {
        const lat = m.latitude;
        const lng = m.longitude;
        if (!lat || !lng) return;

        bounds.push([lat, lng]);
        const temPedidos = m.pedidos_numeros.length > 0;
        const pedidosHtml = temPedidos 
          ? m.pedidos_detalhes.map(p => `<span class="tag-pedido">#${p.numero_pedido}</span>`).join(' ')
          : '<em style="color: var(--text-muted); font-size: 12px;">Sem pedidos no momento</em>';

        const popupContent = `
          <div class="popup-box">
            <div class="popup-title">🛵 ${m.nome}</div>
            <div class="popup-phone">📞 ${m.telefone} | ⚡ ${Math.round(m.speed || 0)} km/h</div>
            <div class="popup-pedidos-title">Pedidos em Rota:</div>
            <div class="pedidos-tags">${pedidosHtml}</div>
          </div>
        `;

        if (markers[m.motoboy_id]) {
          markers[m.motoboy_id].setLatLng([lat, lng]);
          markers[m.motoboy_id].getPopup().setContent(popupContent);
        } else {
          const customIcon = L.divIcon({
            className: 'custom-marker',
            html: '🛵',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
          });

          const marker = L.marker([lat, lng], { icon: customIcon })
            .bindPopup(popupContent)
            .addTo(map);

          markers[m.motoboy_id] = marker;
        }
      });

      if (bounds.length > 0 && !window.mapBoundsAdjusted) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        window.mapBoundsAdjusted = true;
      }
    }

    function focarMotoboyNoMapa(motoboy_id) {
      const m = motoboysData.find(item => item.motoboy_id === motoboy_id);
      if (m && markers[motoboy_id]) {
        map.setView([m.latitude, m.longitude], 16, { animate: true });
        markers[motoboy_id].openPopup();
        focarElementoMapaMobile();
      }
    }

    // --- CARREGAR HISTÓRICO DE ENTREGAS E ROTAS ---

    async function carregarHistorico() {
      const container = document.getElementById('historicoList');
      container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">Carregando histórico...</div>`;

      try {
        const res = await fetch('/api/admin/historico');
        const data = await res.json();

        if (res.ok && data.success) {
          historicoData = data.entregas || [];
          renderizarListaHistorico();
        } else {
          container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 20px;">Falha ao carregar histórico.</div>`;
        }
      } catch (err) {
        console.error('Erro no histórico:', err);
      }
    }

    function renderizarListaHistorico() {
      const container = document.getElementById('historicoList');
      const termo = document.getElementById('searchInput').value.toLowerCase().trim();

      const entregasFiltradas = historicoData.filter(e => {
        if (!termo) return true;
        return e.numero_pedido.toLowerCase().includes(termo) ||
               e.motoboy.nome.toLowerCase().includes(termo) ||
               e.motoboy.telefone.toLowerCase().includes(termo);
      });

      if (entregasFiltradas.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 40px 10px;">
            <div style="font-size: 32px; margin-bottom: 8px;">📦</div>
            <p>Nenhuma entrega registrada no histórico.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = entregasFiltradas.map(e => {
        const isEntregue = e.status === 'entregue';
        const dataInicioFmt = formatarHoraBrasilia(e.data_inicio);
        const dataFimFmt = e.data_fim ? formatarHoraBrasilia(e.data_fim) : 'Em andamento';

        return `
          <div class="card-item">
            <div class="card-item-header">
              <div class="card-title">
                <span class="status-dot ${isEntregue ? 'done' : 'active'}"></span>
                Pedido #${e.numero_pedido}
              </div>
              <span class="tag-pedido" style="background: ${isEntregue ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.2)'}; color: ${isEntregue ? '#6ee7b7' : '#fcd34d'}; border-color: ${isEntregue ? '#10b981' : '#f59e0b'};">
                ${isEntregue ? 'ENTREGUE' : 'EM ROTA'}
              </span>
            </div>

            <div class="card-meta">
              <span>🛵 ${e.motoboy.nome}</span>
              <span>⏱️ <strong>${e.duracao_minutos} min</strong></span>
            </div>

            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between;">
              <span>Saída: <strong>${dataInicioFmt}</strong></span>
              <span>Chegada: <strong>${dataFimFmt}</strong></span>
              <span>📍 ${e.total_pontos_gps} pings</span>
            </div>

            <button class="btn-rota" onclick="desenharRotaDoPedido(${e.pedido_id})">
              🗺️ VER ROTA PERCORRIDA NO MAPA
            </button>
          </div>
        `;
      }).join('');
    }

    // DESENHAR ROTA PERCORRIDA COM TRAÇADO BRILHANTE E PONTOS GPS
    async function desenharRotaDoPedido(pedido_id) {
      limparRotaNoMapa();

      try {
        const res = await fetch(`/api/admin/historico/rota?pedido_id=${pedido_id}`);
        const data = await res.json();

        if (!res.ok || !data.success) {
          alert('Não foi possível obter os pontos da rota deste pedido.');
          return;
        }

        const pontos = data.pontos || [];
        const pedido = data.pedido;

        if (pontos.length === 0) {
          alert(`O pedido #${pedido.numero_pedido} não possui pontos de GPS gravados durante a entrega.`);
          return;
        }

        const latLngs = pontos.map(p => [p.latitude, p.longitude]);

        // 1. Linha de Fundo (Escura/Glow)
        activeRoutePolylineBg = L.polyline(latLngs, {
          color: '#004080',
          weight: 9,
          opacity: 0.6
        }).addTo(map);

        // 2. Linha Principal (Azul Neon Brilhante #00f0ff)
        activeRoutePolylineFg = L.polyline(latLngs, {
          color: '#00f0ff',
          weight: 5,
          opacity: 0.9,
          smoothFactor: 1
        }).addTo(map);

        // 3. Desenhar PONTOS INTERMEDIÁRIOS de GPS ao longo da rota
        pontos.forEach((p, idx) => {
          const isStart = idx === 0;
          const isEnd = idx === pontos.length - 1;

          if (isStart) {
            // Marcador de Início 🟢
            const startIcon = L.divIcon({ className: 'route-marker-start', html: '🟢', iconSize: [30, 30] });
            const startMarker = L.marker([p.latitude, p.longitude], { icon: startIcon })
              .bindPopup(`<b>🟢 Início da Entrega #${pedido.numero_pedido}</b><br>Entregador: ${pedido.motoboy.nome}<br>Horário: ${formatarHoraBrasilia(p.criado_em)}`)
              .addTo(map);
            routeMarkers.push(startMarker);
          } else if (isEnd) {
            // Marcador de Fim 🏁
            const endIcon = L.divIcon({ className: 'route-marker-end', html: '🏁', iconSize: [30, 30] });
            const endMarker = L.marker([p.latitude, p.longitude], { icon: endIcon })
              .bindPopup(`<b>🏁 Chegada #${pedido.numero_pedido}</b><br>Entregador: ${pedido.motoboy.nome}<br>Duração: <strong>${pedido.duracao_minutos} min</strong><br>Horário: ${formatarHoraBrasilia(p.criado_em)}`)
              .addTo(map);
            routeMarkers.push(endMarker);
          } else {
            // Ponto Intermediário (Circulo azul interativo)
            const circle = L.circleMarker([p.latitude, p.longitude], {
              radius: 6,
              color: '#00f0ff',
              fillColor: '#3b82f6',
              fillOpacity: 0.9,
              weight: 2
            }).bindPopup(`<b>📍 Ponto GPS #${idx + 1}</b><br>Horário: ${formatarHoraBrasilia(p.criado_em)}<br>Velocidade: ${Math.round(p.velocidade)} km/h`)
              .addTo(map);
            routeMarkers.push(circle);
          }
        });

        // 4. Enquadrar o mapa para exibir todo o percurso
        if (latLngs.length > 1) {
          map.fitBounds(activeRoutePolylineFg.getBounds(), { padding: [60, 60] });
        } else {
          map.setView(latLngs[0], 16);
        }

        // 5. Rolar para o mapa no Mobile e exibir aviso
        exibirToastMapa(`📍 Exibindo rota do pedido #${pedido.numero_pedido} (${pontos.length} pontos, ${pedido.duracao_minutos} min)`);
        focarElementoMapaMobile();

      } catch (err) {
        console.error('Erro ao desenhar rota:', err);
        alert('Erro ao carregar mapa da rota.');
      }
    }

    function limparRotaNoMapa() {
      if (activeRoutePolylineBg) {
        map.removeLayer(activeRoutePolylineBg);
        activeRoutePolylineBg = null;
      }
      if (activeRoutePolylineFg) {
        map.removeLayer(activeRoutePolylineFg);
        activeRoutePolylineFg = null;
      }
      routeMarkers.forEach(m => map.removeLayer(m));
      routeMarkers = [];
    }

    function focarElementoMapaMobile() {
      const mapEl = document.getElementById('map');
      if (mapEl && window.innerWidth <= 768) {
        mapEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function exibirToastMapa(msg) {
      const toast = document.getElementById('mapToast');
      const msgEl = document.getElementById('mapToastMsg');
      if (toast && msgEl) {
        msgEl.textContent = msg;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
      }
    }

    function filtrarConteudo() {
      if (abaAtual === 'aovivo') renderizarListaMotoboys();
      else renderizarListaHistorico();
    }
  </script>
